<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>بوصلة المستقبل</title>
<meta name="description" content="بوصلة المستقبل: محاكي القبول الموحد ودليل المسارات الأكاديمية لطلبة الصفوف 10 إلى 12 في سلطنة عُمان.">
<meta name="theme-color" content="#4A5D2A">
<link rel="icon" type="image/png" href="favicon.png">
<link rel="apple-touch-icon" href="logo.png">
<meta property="og:title" content="بوصلة المستقبل">
<meta property="og:description" content="اعرف وين يوصلك معدلك: محاكي القبول الموحد ودليل الطالب 2026/2027.">
<meta property="og:url" content="https://bosla-om.github.io/">
<meta property="og:image" content="https://bosla-om.github.io/share.jpg">
<style>
  html,body{margin:0;height:100%;background:#F3F4EF;overflow:hidden}
  iframe{position:fixed;inset:0;width:100%;height:100%;border:0;display:block}
  .load{position:fixed;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;font:600 17px Tahoma,sans-serif;color:#3F4842}
  .load img{width:96px;height:96px}
  .load a{color:#34431C}
</style>
</head>
<body>
<div class="load" id="load">
  <img src="logo.png" alt="">
  <div>جارٍ فتح بوصلة المستقبل…</div>
  <a id="direct" href="#">إذا ما فتح الموقع، اضغط هنا</a>
</div>
<script>
  /* ===== ضع هنا رابط موقعك من Apps Script (اللي ينتهي بـ /exec) ===== */
  const SITE = "https://script.google.com/macros/s/AKfycbyU4tBXEdUEviiN3N6r9eC2FSRwk33ctH2-3LMoW5fvs22b-DwDqstRj7ziIVeREAgpGA/exec";
  /* ================================================================ */

  const q = location.search; // يمرر ?open=book أو ?open=guide&page=… من الكيو آر
  const url = SITE + (q || "");
  document.getElementById('direct').href = url;
  const f = document.createElement('iframe');
  f.src = url;
  f.title = 'بوصلة المستقبل';
  f.allow = 'clipboard-write; fullscreen';
  f.onload = () => document.getElementById('load').remove();
  document.body.appendChild(f);
</script>
</body>
</html>
